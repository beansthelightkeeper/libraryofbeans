<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delta Analysis - Gematria Database</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Roboto+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="gematria.css">
</head>
<body data-theme="dark">
    <nav class="main-nav">
        <div class="nav-links">
            <a href="gematria.html">Calculator</a>
            <a href="delta.html" class="active">Delta</a>
            <a href="statistics.html">Statistics</a>
            <a href="ciphers.html">Ciphers</a>
        </div>
        <button id="theme-toggle" class="theme-toggle-button"></button>
    </nav>

    <div class="container">
        <header class="site-header">
            <h1>Delta Analysis</h1>
            <p>Calculate the gematria difference between two phrases</p>
        </header>

        <main class="delta-main">
            <section class="delta-input-grid">
                <textarea id="delta-input-1" placeholder="Enter first word or phrase..." rows="3"></textarea>
                <textarea id="delta-input-2" placeholder="Enter second word or phrase..." rows="3"></textarea>
            </section>

            <section id="delta-results-container">
                <!-- Delta results will be injected here -->
            </section>

            <section class="corpus-uploader">
                <h3>Corpus Uploader</h3>
                <p>Upload a .txt or .md file to add its lines to the database. Each line will be treated as a separate phrase.</p>
                <input type="file" id="file-input" accept=".txt,.md">
                <button id="upload-button">Upload to Database</button>
                <div id="upload-status"></div>
            </section>
        </main>
    </div>

    <footer class="site-footer">
        <div class="nav-links">
            <a href="gematria.html">Calculator</a>
            <a href="delta.html" class="active">Delta</a>
            <a href="statistics.html">Statistics</a>
            <a href="ciphers.html">Ciphers</a>
        </div>
    </footer>
    
    <script src="firebase-config.js"></script>
    <script type="module" src="delta.js"></script>
</body>
</html>
