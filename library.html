<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library of Beans</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.js"></script>
    <link rel="icon" href="data:;base64,iVBORw0KGgo="> <!-- Suppress favicon requests -->
</head>
<body data-theme="dark">
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="main-controls">
                    <button id="theme-toggle" title="Toggle Theme"></button>
                    <button id="rainbow-toggle" title="Rainbow Effects">FX</button>
                    <button id="menu-toggle" title="Toggle Menu">☰</button>
                    <button id="minimize-toggle" title="Minimize Sidebar">➤</button>
                    <a href="https://beanscodex.com" class="home-link" title="Home">🏠</a>
                </div>
                <span class="logo">Library of Beans</span>
            </div>
            <div class="sidebar-content">
                <div class="file-navigation">
                    <h2 id="library-section-header">Library📖</h2>
                    <div id="file-list-container">
                        <ul></ul>
                    </div>
                </div>
                <div class="reader-tools">
                    <h2>Tools🛠️</h2>
                    <div class="tool-group">
                        <label>Layout</label>
                        <div class="slider-container">
                            <span>Margins</span>
                            <input type="range" id="margin-slider" min="0" max="20" value="10">
                        </div>
                    </div>
                    <div class="tool-group">
                        <label>Font Size</label>
                        <div class="slider-container">
                            <span>A-</span>
                            <input type="range" id="font-size-slider" min="12" max="24" value="16">
                            <span>A+</span>
                        </div>
                    </div>
                    <div class="tool-group">
                        <div class="layout-controls">
                            <button id="double-space-toggle">Double Space</button>
                        </div>
                    </div>
                </div>
                <div class="reader-tools">
                    <h2>Bookmarks📑</h2>
                    <button id="clear-bookmarks-btn">Clear All</button>
                    <ul id="bookmarks-list"></ul>
                </div>
                <div class="reader-tools">
                    <h2>Annotations📝</h2>
                    <button id="clear-annotations-btn">Clear All</button>
                    <ul id="annotations-list"></ul>
                </div>
            </div>
        </div>
        <div class="content-viewer">
            <div id="welcome-message">
                <div class="logo-graphic">
                    <div class="triangle"></div>
                    <div class="triangle"></div>
                    <div class="triangle"></div>
                </div>
                <h1>Welcome to the Library of Beans</h1>
                <p>Select a file from the library to begin.</p>
            </div>
            <iframe id="content-frame"></iframe>
        </div>
    </div>
    <div class="bottom-toolbar">
        <div class="tool-group">
            <button id="add-bookmark-btn">Bookmark</button>
            <button id="highlight-mode-toggle">Highlight</button>
            <button id="erase-mode-toggle">Erase</button>
            <button id="add-note-btn">Add Note</button>
        </div>
        <div class="tool-group color-palette" id="highlighter-colors">
            <div class="color-swatch" data-color="yellow"></div>
            <div class="color-swatch" data-color="pink"></div>
            <div class="color-swatch" data-color="green"></div>
            <div class="color-swatch" data-color="blue"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
