<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gematria Statistics</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Roboto+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="gematria.css">
</head>
<body data-theme="dark">
    <nav class="main-nav">
        <div class="nav-links">
            <a href="gematria.html">Calculator</a>
            <a href="delta.html">Delta</a>
            <a href="statistics.html" class="active">Statistics</a>
            <a href="ciphers.html">Ciphers</a>
        </div>
        <button id="theme-toggle" class="theme-toggle-button"></button>
    </nav>

    <div class="container">
        <header class="site-header">
            <h1>Gematria Statistics</h1>
            <p>Analyze the frequency and resonance of phrases in your database</p>
        </header>
        
        <main class="main-content">
            <div class="input-area">
                <textarea id="stats-input" placeholder="Enter a phrase to analyze..." rows="3"></textarea>
            </div>

            <div id="results-summary" class="results-summary-bar">
                <!-- Gematria value cards will be injected here -->
            </div>
            
            <div id="breakdown-container" class="breakdown-container">
                <!-- Letter-by-letter breakdown will be injected here -->
            </div>

            <div id="comparison-container" class="comparison-container">
                <!-- The comparison chart will be injected here when a match is clicked -->
            </div>

            <div id="statistics-results-container">
                 <!-- Match tables with statistical info will be injected here -->
            </div>
        </main>
    </div>

     <footer class="site-footer">
        <div class="nav-links">
            <a href="gematria.html">Calculator</a>
            <a href="delta.html">Delta</a>
            <a href="statistics.html" class="active">Statistics</a>
            <a href="ciphers.html">Ciphers</a>
        </div>
    </footer>
    
    <script src="firebase-config.js"></script>
    <script type="module" src="statistics.js"></script>
</body>
</html>
