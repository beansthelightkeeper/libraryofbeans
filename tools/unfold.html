<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Unfolder Analysis</title>
    <stylesheet href="gematriamain/gematria.css"></stylesheet>
    <stylesheet href="../header.css"></stylesheet>
    <stylesheet href="../footer.css"></stylesheet> 
    <script src="../header.js" defer></script>
    <script src="../footer.js" defer></script>
    <script src="unfold.js" defer></script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200 min-h-screen flex items-center justify-center p-4">
    <div id="main-header-placeholder"></div>
    <div class="w-full max-w-2xl bg-white dark:bg-gray-800 rounded-2xl shadow-lg p-6 md:p-8">
        <main>
            <div class="flex items-center justify-center gap-6 mb-4">
                <label class="flex items-center cursor-pointer">
                    <input type="radio" name="storageType" value="local" class="form-radio" checked>
                    <span class="ml-2 text-gray-700 dark:text-gray-300">LocalStorage</span>
                </label>
                <label class="flex items-center cursor-pointer">
                    <input type="radio" name="storageType" value="firebase" class="form-radio">
                    <span class="ml-2 text-gray-700 dark:text-gray-300">Firebase</span>
                </label>
            </div>
             <div id="firebaseStatus" class="text-center text-xs text-gray-500 dark:text-gray-400 mb-4 h-4"></div>

            <div class="flex flex-col sm:flex-row gap-3 mb-6">
                <input 
                    type="text" 
                    id="wordInput" 
                    placeholder="Enter a word or phrase..."
                    onkeypress="handleKeyPress(event)"
                    class="flex-grow w-full px-4 py-3 bg-gray-100 dark:bg-gray-700 border-2 border-transparent focus:border-blue-500 dark:focus:border-blue-400 rounded-lg text-lg outline-none transition-colors duration-200"
                >
                <button 
                    onclick="analyze()" 
                    class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow-md focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 dark:focus:ring-offset-gray-800 transition-all duration-200 transform hover:scale-105"
                >
                    Analyze
                </button>
            </div>

            <div class="bg-gray-50 dark:bg-gray-900 rounded-lg p-4 mt-4">
                <h2 class="text-lg font-semibold mb-2 text-gray-800 dark:text-gray-200">Analysis Results:</h2>
                <pre id="results" class="text-sm md:text-base text-gray-700 dark:text-gray-300 whitespace-pre-wrap break-words font-mono min-h-[250px]"></pre>
            </div>
        </main>
        
    </div>

</body>
<footer id="main-footer-placeholder"></footer>
</html>
