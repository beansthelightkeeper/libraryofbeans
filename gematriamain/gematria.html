<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gematria Calculator</title>
    <link rel="icon" type="image/png" href="../icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Roboto+Mono&display=swap" rel="stylesheet">
    <!-- Link to shared header CSS -->
    <link rel="stylesheet" href="../header.css">
    <!-- Link to the specific CSS for this page -->
    <link rel="stylesheet" href="gematria.css">
</head>
<body data-theme="dark">

    <!-- The dynamic header will be inserted here -->
    <div id="main-header-placeholder"></div>

    <div class="container">
        <header class="page-header">
            <img src="https://placehold.co/100x100/333333/FFFFFF?text=LOB" alt="Seal Image" class="header-seal">
            <h1>Gematria Calculator</h1>
            <p class="subtitle">Enter a word or a phrase below (e.g., God, Devil, 100, 666) to calculate gematria values.</p>
        </header>

        <main class="calculator-main">
            <div class="input-area">
                <input type="text" id="text-input" placeholder="Insert phrase" autofocus>
                <button id="calculate-btn">Calculate Gematria</button>
            </div>
             <div class="options-area">
                <label><input type="checkbox" id="live-update-checkbox" checked> Live Update</label>
            </div>

            <div id="results-container" class="results-container">
                <!-- Calculation results will be injected here -->
            </div>
            
            <div id="breakdown-container" class="breakdown-container">
                 <!-- Character breakdown will appear here -->
            </div>
        </main>
        
        <section class="statistics-section">
            <h2>Most Searched Gematria Words</h2>
            <table id="stats-table">
                <thead>
                    <tr>
                        <th>Word</th>
                        <th>Searches</th>
                        <th>English Ordinal</th>
                        <th>Full Reduction</th>
                        <th>Jewish Gematria</th>
                    </tr>
                </thead>
                <tbody id="stats-tbody">
                    <!-- Statistics rows will be injected here -->
                </tbody>
            </table>
        </section>

    </div>

    <!-- Set the path prefix for this subdirectory -->
    <script>
        window.pathPrefix = '..';
    </script>
    <script src="../header.js"></script>
    <script src="../firebase-config.js"></script>
    <script type="module" src="local-db.js"></script>
    <script type="module" src="gematria.js"></script>
</body>
</html>
