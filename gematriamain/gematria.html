<!DOCTYPE html>
<html lang="en">        
<head>      
    <meta charset="utf-8">        
    <meta http-equiv="x-ua-compatible" content="ie=edge">        
    <meta name="viewport" content="width=device-width, initial-scale=1.0">   
    <title>Gematria Calculator Results</title>        
    <link rel="icon" type="image/png" href="../icon.png" />        
    <link rel="stylesheet" href="gematria.css">
    <link rel="stylesheet" href="../header.css">
    <link rel="stylesheet" href="../footer.css">
    <script src="../header.js" defer></script> 
    <script src="../footer.js" defer></script> 

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <!-- Your configuration and main script -->
    <!-- CORRECTED the file path here to point to the parent directory -->
    <script src="../firebase-config.js" defer></script>
    <script src="calculator.js" defer></script>
</head>    
<body>
    <header id="main-header-placeholder"></header>

    <div class="container">
        <div class="ad-pillar"></div>
        <article class="content">
            <img src="../icon.png" alt="Site Icon" style="width: 100px; height: 100px; display: block; margin: 2rem auto 1rem auto; border-radius: 50%;">
            
            <div class="search-area">
                <h1 class="main-title">Gematria Calculation for: <span id="word-display" style="color: #c8a2c8;"></span></h1>
                
                <form id="gematria-form">    
                    <label for="use_localstorage"><input type="checkbox" id="use_localstorage" name="use_localstorage" /> Use Local Storage</label>
                    <br><br>
                    <input type="search" name="word" id="word-input" placeholder="Try another phrase" maxlength="200" /><br><br>
                    <input type="submit" value="Calculate" />
                    <button type="button" id="save-word-btn">Save Word to Database</button><br><br>
                    <label for="view_rude"><input type="checkbox" id="view_rude" name="view_rude" /> View Rude Words</label>
                </form>
                <div id="save-status"></div>
            </div>                

            <div id="results-area">
                <p>Enter a word above to see the Gematria calculation results.</p>
            </div>
        
        </article>
        <div class="ad-pillar"></div>
    </div> 
    <footer id="main-footer-placeholder"></footer>
</body>
</html>
