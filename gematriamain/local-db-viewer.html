<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Gematria DB Viewer</title>
    <link rel="stylesheet" href="gematria.css">
    <link rel="stylesheet" href="../header.css">
    <link rel="stylesheet" href="../footer.css">
    <script src="../header.js" defer></script> 
    <script src="../footer.js" defer></script> 
</head>
<body>
    <header id="main-header-placeholder"></header>

    <div class="container">
        <div class="ad-pillar"></div>
        <article class="content">
            <img src="https://placehold.co/100x100/1e1e1e/c8a2c8?text=DB" alt="Site Icon" style="width: 100px; height: 100px; display: block; margin: 2rem auto 1rem auto; border-radius: 50%;">
            
            <div class="search-area">
                <h1 class="main-title">Local Database Viewer</h1>
            </div>                

            <div id="results-area">
                <p>Loading database...</p>
            </div>
        </article>
        <div class="ad-pillar"></div>
    </div> 

    <footer id="main-footer-placeholder"></footer>

    <!-- Use the existing local-db.js logic -->
    <script src="local-db.js"></script> 
    <!-- This new script will handle displaying the data -->
    <script src="local-db-viewer.js"></script>
</body>
</html>
