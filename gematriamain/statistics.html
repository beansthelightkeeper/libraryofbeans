<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gematria Statistics</title>
    <link rel="stylesheet" href="gematria.css">
    <link rel="stylesheet" href="../header.css">
    <link rel="stylesheet" href="../footer.css">
    <script src="../header.js" defer></script>
    <script src="../footer.js" defer></script>
    
    <!-- Firebase SDKs (matching the calculator) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
    <div id="main-header-placeholder"></div>
    <div class="container">
        <div class="ad-pillar"></div>
        <article class="content">
            <img src="../icon.png" alt="Statistics Icon" style="width: 100px; height: 100px; display: block; margin: 2rem auto 1rem auto; border-radius: 50%;">
            
            <div class="search-area">
                <h1 class="main-title">Database Statistics</h1>
                <p class="subtitle">An overview of all words in the database, sorted by the most popular.</p>
                <div style="text-align: center; margin-top: 1rem;">
                    <label for="use-localstorage" style="cursor: pointer;">
                        <input type="checkbox" id="use-localstorage" name="use-localstorage">
                        Use Local Storage Instead of Firebase
                    </label>
                </div>
            </div>

            <!-- Chart 1: Most Popular Words -->
            <div id="popularity-section" class="results-section">
                <h2 class="results-header">Word Popularity</h2>
                <table class="results-table">
                    <thead>
                        <tr>
                            <th>Word</th>
                            <th>Jewish</th>
                            <th>English</th>
                            <th>Simple</th>
                            <th>Search Count</th>
                        </tr>
                    </thead>
                    <tbody id="popularity-body">
                        <!-- Data will be loaded here -->
                    </tbody>
                </table>
            </div>

            <!-- Chart 2: Most Recently Searched -->
            <div id="recent-searches-section" class="results-section" style="margin-top: 3rem;">
                <h2 class="results-header">Most Recently Searched</h2>
                <table class="results-table">
                    <thead>
                        <tr>
                            <th>Word</th>
                            <th>Jewish</th>
                            <th>English</th>
                            <th>Simple</th>
                            <th>Search Count</th>
                        </tr>
                    </thead>
                    <tbody id="recent-searches-body">
                        <!-- Data will be loaded here -->
                    </tbody>
                </table>
            </div>

            <!-- Chart 3: Most Recently Added -->
            <div id="recent-additions-section" class="results-section" style="margin-top: 3rem;">
                <h2 class="results-header">Most Recently Added</h2>
                <table class="results-table">
                    <thead>
                        <tr>
                            <th>Word</th>
                            <th>Jewish</th>
                            <th>English</th>
                            <th>Simple</th>
                            <th>Search Count</th>
                        </tr>
                    </thead>
                    <tbody id="recent-additions-body">
                        <!-- Data will be loaded here -->
                    </tbody>
                </table>
            </div>

        </article>
        <div class="ad-pillar"></div>
    </div>
    <footer id="main-footer-placeholder"></footer>

    <!-- Load scripts at the end of the body -->
    <script src="../firebase-config.js"></script>
    <script src="statistics.js"></script>
</body>
</html>
