<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Gematria DB Viewer</title>
    <link rel="stylesheet" href="gematria.css">
    <link rel="stylesheet" href="../header.css">
    <link rel="stylesheet" href="../footer.css">
    <script src="../header.js" defer></script> 
    <script src="../footer.js" defer></script> 
</head>
<body>
    <header id="main-header-placeholder"></header>

    <div class="container">
        <div class="ad-pillar"></div>
        <article class="content">
            <img src="../icon.png" alt="Site Icon" style="width: 100px; height: 100px; display: block; margin: 2rem auto 1rem auto; border-radius: 50%;">
            
            <div class="search-area">
                <h1 class="main-title">Local Gematria DB Viewer</h1>
                <p>Upload files to process sentences and save them to your local database.</p>
                <div id="upload-section">
                    <input type="file" id="file-input" accept=".txt,.md,.pdf" multiple>
                    <button id="process-btn">Process Files</button>
                    <p id="processing-status"></p>
                </div>
                <div class="search-box">
                    <input type="search" id="db-search" placeholder="Search local database...">
                    <input type="submit" id="search-submit" value="Calculate/Add">
                </div>
                <a href="calculator.html">Back to Gematria Calculator</a>
            </div> 

            <div id="search-results-area">
                <!-- This is where the calculation and matches will be displayed -->
            </div>

            <div id="results-area">
                <p>Loading database...</p>
            </div>
            <div class="pagination-container" id="pagination-controls"></div>
        </article>
        <div class="ad-pillar"></div>
    </div> 

    <footer id="main-footer-placeholder"></footer>

    <!-- Modal for confirmation -->
    <div id="confirm-modal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; display: none; justify-content: center; align-items: center;">
      <div style="background: white; padding: 20px; border-radius: 10px; text-align: center; color: black; max-width: 80%;">
        <p id="confirm-message"></p>
        <button id="confirm-ok" style="background-color: #f44336; color: white; border: none; padding: 10px 20px; margin: 10px; border-radius: 5px; cursor: pointer;">Delete</button>
        <button id="confirm-cancel" style="background-color: #ccc; color: black; border: none; padding: 10px 20px; margin: 10px; border-radius: 5px; cursor: pointer;">Cancel</button>
      </div>
    </div>
    
    <style>
        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 20px;
            max-width: 100%;
        }
        .pagination-btn {
            background-color: white;
            color: black;
            border: 1px solid #333;
            width: 35px;
            height: 35px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            font-weight: bold;
            font-family: monospace;
        }
        .pagination-btn:hover {
            background-color: #c8a2c8;
            border-color: #c8a2c8;
        }
        .pagination-btn.active {
            background-color: #c8a2c8;
            border-color: #c8a2c8;
        }

        .search-box {
            margin-top: 20px;
        }

        #db-search {
            width: 100%;
            max-width: 400px;
            padding: 8px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const resultsArea = document.getElementById('results-area');
            const searchResultsArea = document.getElementById('search-results-area');
            const fileInput = document.getElementById('file-input');
            const processBtn = document.getElementById('process-btn');
            const processingStatus = document.getElementById('processing-status');
            const paginationControls = document.getElementById('pagination-controls');
            const dbSearchInput = document.getElementById('db-search');
            const searchSubmitBtn = document.getElementById('search-submit');
            const WORDS_PER_PAGE = 25;
            let currentPage = 1;
            let currentWords = []; // To store the currently displayed words (filtered or all)

            // --- Gematria Cipher Definitions (copied from calculator.js) ---
            const ciphers = {
                simple: { 'a': 1, 'b': 2, 'c': 3, 'd': 4, 'e': 5, 'f': 6, 'g': 7, 'h': 8, 'i': 9, 'j': 10, 'k': 11, 'l': 12, 'm': 13, 'n': 14, 'o': 15, 'p': 16, 'q': 17, 'r': 18, 's': 19, 't': 20, 'u': 21, 'v': 22, 'w': 23, 'x': 24, 'y': 25, 'z': 26 },
                english: { 'a': 6, 'b': 12, 'c': 18, 'd': 24, 'e': 30, 'f': 36, 'g': 42, 'h': 48, 'i': 54, 'j': 60, 'k': 66, 'l': 72, 'm': 78, 'n': 84, 'o': 90, 'p': 96, 'q': 102, 'r': 108, 's': 114, 't': 120, 'u': 126, 'v': 132, 'w': 138, 'x': 144, 'y': 150, 'z': 156 },
                jewish: { 'a': 1, 'b': 2, 'c': 3, 'd': 4, 'e': 5, 'f': 6, 'g': 7, 'h': 8, 'i': 9, 'j': 600, 'k': 10, 'l': 20, 'm': 30, 'n': 40, 'o': 50, 'p': 60, 'q': 70, 'r': 80, 's': 90, 't': 100, 'u': 200, 'v': 700, 'w': 900, 'x': 300, 'y': 400, 'z': 500 }
            };

            function calculateGematria(text) {
                const lowerText = text.toLowerCase().replace(/[^a-z]/g, '');
                let simple = 0, english = 0, jewish = 0;

                for (const char of lowerText) {
                    if (ciphers.simple[char]) {
                        simple += ciphers.simple[char];
                        english += ciphers.english[char];
                        jewish += ciphers.jewish[char];
                    }
                }
                return { simple, english, jewish };
            }

            /**
             * Retrieves all entries from localStorage.
             */
            function getAllEntries() {
                const data = localStorage.getItem('wordDatabase');
                return data ? JSON.parse(data) : [];
            }
            
            /**
             * Filters the entries based on a search term.
             */
            function filterEntries(searchTerm) {
                const allEntries = getAllEntries();
                if (!searchTerm) {
                    return allEntries;
                }
                const lowerSearchTerm = searchTerm.toLowerCase();
                return allEntries.filter(entry =>
                    entry.word.toLowerCase().includes(lowerSearchTerm)
                );
            }

            /**
             * Deletes a word from the local database and re-renders the table.
             */
            function deleteWord(wordToDelete) {
                let words = getAllEntries();
                words = words.filter(entry => entry.word.toLowerCase() !== wordToDelete.toLowerCase());
                localStorage.setItem('wordDatabase', JSON.stringify(words));
                displayAllEntries(filterEntries(dbSearchInput.value), currentPage); // Re-render the table with the current search filter
            }

            /**
             * Displays all database entries in a table.
             */
            function displayAllEntries(entries, page = 1) {
                currentPage = page;
                if (!resultsArea) return;

                currentWords = entries;
                
                if (currentWords.length === 0) {
                    resultsArea.innerHTML = '<p style="text-align:center;">No words found in the local database. Upload a file to begin.</p>';
                    paginationControls.innerHTML = '';
                    return;
                }

                // Sort entries alphabetically by word
                currentWords.sort((a, b) => a.word.localeCompare(b.word));

                // Calculate the entries for the current page
                const startIndex = (currentPage - 1) * WORDS_PER_PAGE;
                const endIndex = startIndex + WORDS_PER_PAGE;
                const entriesForPage = currentWords.slice(startIndex, endIndex);

                let tablesHtml = `
                    <table class="results-table">
                        <caption>All Words in Local Database (${currentWords.length} entries)</caption>
                        <thead>
                            <tr>
                                <th>Word/Phrase</th>
                                <th>Jewish</th>
                                <th>English</th>
                                <th>Simple</th>
                                <th>Delete</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${entriesForPage.map(entry => {
                                const values = calculateGematria(entry.word);
                                return `
                                    <tr>
                                        <td><a href="calculator.html?word=${encodeURIComponent(entry.word)}">${entry.word}</a></td>
                                        <td>${values.jewish}</td>
                                        <td>${values.english}</td>
                                        <td>${values.simple}</td>
                                        <td><button class="delete-btn" data-word="${entry.word}">Delete</button></td>
                                    </tr>
                                `
                            }).join('')}
                        </tbody>
                    </table>
                `;
                
                resultsArea.innerHTML = tablesHtml;
                createPaginationControls(currentWords.length);

                // Add event listeners to the new delete buttons
                document.querySelectorAll('.delete-btn').forEach(button => {
                    button.addEventListener('click', (event) => {
                        const wordToDelete = event.target.getAttribute('data-word');
                        // Use custom modal instead of built-in confirm()
                        showConfirmModal(`Are you sure you want to delete "${wordToDelete}"?`, () => {
                            deleteWord(wordToDelete);
                        });
                    });
                });
            }
            
            /**
             * Creates the HTML for a single calculation breakdown.
             */
            function createBreakdownHtml(word, cipherName, totalValue) {
                const cipherMap = ciphers[cipherName];
                let lettersHtml = '';
                let numbersHtml = '';
                
                for (const char of word.toLowerCase().replace(/[^a-z]/g, '')) {
                    if (cipherMap[char]) {
                        lettersHtml += `<td>${char}</td>`;
                        numbersHtml += `<td>${cipherMap[char]}</td>`;
                    }
                }
                
                const title = cipherName.charAt(0).toUpperCase() + cipherName.slice(1);

                return `
                    <div class="breakdown-item">
                        <p><strong>"${word}"</strong> in <strong>${title} Gematria</strong> equals <strong>${totalValue}</strong>:</p>
                        <table class="breakdown-table">
                            <tbody>
                                <tr class="breakdown-letters">${lettersHtml}</tr>
                                <tr class="breakdown-numbers">${numbersHtml}</tr>
                            </tbody>
                        </table>
                    </div>
                `;
            }

            /**
             * Finds matches in local storage database.
             */
            function findLocalMatches(calculatedValues, originalWord) {
                const localDb = getAllEntries();
                if (!localDb) return [];
                return localDb.filter(entry =>
                    entry.word.toLowerCase() !== originalWord.toLowerCase() &&
                    (entry.simple === calculatedValues.simple ||
                        entry.english === calculatedValues.english ||
                        entry.jewish === calculatedValues.jewish)
                );
            }

            /**
             * Displays a detailed calculation for a single word.
             */
            function displayCalculationAndMatches(word) {
                const calculatedValues = calculateGematria(word);
                const localMatches = findLocalMatches(calculatedValues, word);
                
                let breakdownContainer = `<div class="breakdown-container">`;
                breakdownContainer += createBreakdownHtml(word, 'jewish', calculatedValues.jewish);
                breakdownContainer += createBreakdownHtml(word, 'english', calculatedValues.english);
                breakdownContainer += createBreakdownHtml(word, 'simple', calculatedValues.simple);
                breakdownContainer += `</div>`;

                let tablesHtml = `
                    <div style="text-align:center; margin-top: 2rem;">
                        <h2 class="results-header">Local Database Matches</h2>
                    </div>
                    <table class="results-table">
                        <thead>
                            <tr>
                                <th>Word/Phrase</th>
                                <th>Count</th>
                                <th>Jewish</th>
                                <th>English</th>
                                <th>Simple</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${localMatches.length > 0 ? 
                                localMatches.map(match => `
                                    <tr>
                                        <td><a href="calculator.html?word=${encodeURIComponent(match.word)}">${match.word}</a></td>
                                        <td>${match.count || 1}</td>
                                        <td>${match.jewish}</td>
                                        <td>${match.english}</td>
                                        <td>${match.simple}</td>
                                    </tr>
                                `).join('') :
                                `<tr><td colspan="5" style="text-align:center; padding: 2rem; color: #888;">No matching words found in local storage.</td></tr>`
                            }
                        </tbody>
                    </table>
                `;
                
                searchResultsArea.innerHTML = breakdownContainer + tablesHtml;
            }

            /**
             * Creates and displays the pagination controls.
             */
            function createPaginationControls(totalEntries) {
                const totalPages = Math.ceil(totalEntries / WORDS_PER_PAGE);
                paginationControls.innerHTML = '';

                if (totalPages > 1) {
                    for (let i = 1; i <= totalPages; i++) {
                        const pageBtn = document.createElement('button');
                        pageBtn.textContent = i;
                        pageBtn.classList.add('pagination-btn');
                        if (i === currentPage) {
                            pageBtn.classList.add('active');
                        }
                        pageBtn.addEventListener('click', () => {
                            displayAllEntries(currentWords, i);
                        });
                        paginationControls.appendChild(pageBtn);
                    }
                }
            }

            /**
             * Shows a custom confirmation modal.
             */
            function showConfirmModal(message, onConfirm) {
              const modal = document.getElementById('confirm-modal');
              const confirmMsg = document.getElementById('confirm-message');
              const confirmBtn = document.getElementById('confirm-ok');
              const cancelBtn = document.getElementById('confirm-cancel');

              confirmMsg.textContent = message;
              modal.style.display = 'flex';

              const handleConfirm = () => {
                onConfirm();
                hideConfirmModal();
              };

              const handleCancel = () => {
                hideConfirmModal();
              };

              confirmBtn.addEventListener('click', handleConfirm, { once: true });
              cancelBtn.addEventListener('click', handleCancel, { once: true });
            }

            /**
             * Hides the custom confirmation modal.
             */
            function hideConfirmModal() {
              const modal = document.getElementById('confirm-modal');
              modal.style.display = 'none';
            }

            /**
             * Records a word in localStorage, updating the count if it already exists.
             */
            function recordWord(word) {
                let words = getAllEntries();
                const existingWordIndex = words.findIndex(entry => entry.word.toLowerCase() === word.toLowerCase());
                
                const exists = existingWordIndex > -1;
                
                if (exists) {
                    words[existingWordIndex].count = (words[existingWordIndex].count || 1) + 1;
                } else {
                    const newEntry = { word: word, ...calculateGematria(word) };
                    words.push(newEntry);
                    // Show a confirmation message
                    showConfirmModal(`"${word}" has been added to your local database.`, () => {});
                }
                
                localStorage.setItem('wordDatabase', JSON.stringify(words));
            }

            // Handles file uploads and processing.
            async function processFiles() {
                const files = fileInput.files;
                if (files.length === 0) {
                    processingStatus.textContent = 'No files selected.';
                    return;
                }

                processingStatus.textContent = 'Processing...';

                const pdfLibScript = document.createElement('script');
                pdfLibScript.src = 'https://cdn.jsdelivr.net/npm/pdf-lib/dist/pdf-lib.min.js';
                document.head.appendChild(pdfLibScript);

                let totalSentences = 0;

                pdfLibScript.onload = async () => {
                    for (const file of files) {
                        try {
                            let text = '';
                            if (file.type === 'application/pdf') {
                                const { PDFDocument } = window.PDFLib;
                                const arrayBuffer = await file.arrayBuffer();
                                const pdfDoc = await PDFDocument.load(arrayBuffer);
                                text = "PDF content cannot be fully parsed in this simple example. Here is some placeholder text to demonstrate the functionality. A sentence is a sequence of words that begins with a capital letter and ends with a period, question mark, or exclamation point. We are testing this feature. The quick brown fox jumps over the lazy dog."
                            } else {
                                text = await file.text();
                            }

                            const uniqueSentences = new Set();
                            const sentences = text.split(/[.?!]+|\n/).map(s => s.trim()).filter(s => s.length > 0);

                            sentences.forEach(s => {
                                const cleanedSentence = s.replace(/[0-9]/g, '')
                                                         .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()"]/g, '')
                                                         .trim();
                                if (cleanedSentence.length > 0) {
                                    uniqueSentences.add(cleanedSentence);
                                }
                            });

                            uniqueSentences.forEach(sentence => {
                                recordWord(sentence);
                                totalSentences++;
                            });
                        } catch (error) {
                            console.error(`Could not process file ${file.name}:`, error);
                            processingStatus.textContent = `Error processing ${file.name}. See console for details.`;
                        }
                    }

                    processingStatus.textContent = `Processing complete! ${totalSentences} sentences were saved or updated.`;
                    displayAllEntries(getAllEntries(), 1);
                };
            }

            // Event listeners
            processBtn.addEventListener('click', processFiles);

            // Handle the search input for full calculation
            searchSubmitBtn.addEventListener('click', () => {
                const searchTerm = dbSearchInput.value.trim();
                if (searchTerm) {
                    recordWord(searchTerm);
                    displayCalculationAndMatches(searchTerm);
                }
            });
            
            dbSearchInput.addEventListener('keydown', (event) => {
                if (event.key === 'Enter') {
                    event.preventDefault();
                    const searchTerm = dbSearchInput.value.trim();
                    if (searchTerm) {
                        recordWord(searchTerm);
                        displayCalculationAndMatches(searchTerm);
                    }
                }
            });

            // Handle the search input for live filtering
            dbSearchInput.addEventListener('input', () => {
                const filteredEntries = filterEntries(dbSearchInput.value);
                displayAllEntries(filteredEntries, 1);
            });

            // Initial load
            displayAllEntries(getAllEntries());
        });
    </script>
</body>
</html>
