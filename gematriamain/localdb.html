<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Gematria DB Viewer</title>
    <link rel="stylesheet" href="gematria.css">
    <link rel="stylesheet" href="../header.css">
    <link rel="stylesheet" href="../footer.css">
    <script src="../header.js" defer></script> 
    <script src="../footer.js" defer></script> 
</head>
<body>
    <header id="main-header-placeholder"></header>

    <div class="container">
        <div class="ad-pillar"></div>
        <article class="content">
            <img src="../icon.png" alt="Site Icon" style="width: 100px; height: 100px; display: block; margin: 2rem auto 1rem auto; border-radius: 50%;">
            
            <div class="search-area">
                <h1 class="main-title">Local Gematria DB Viewer</h1>
                <p>Upload files to process sentences and save them to your local database.</p>
                <div id="upload-section">
                    <input type="file" id="file-input" accept=".txt,.md,.pdf" multiple>
                    <button id="process-btn">Process Files</button>
                    <p id="processing-status"></p>
                </div>
                <div class="search-box">
                    <input type="search" id="db-search" placeholder="Search local database...">
                    <input type="submit" id="search-submit" value="Calculate/Add">
                </div>
                <a href="calculator.html">Back to Gematria Calculator</a>
            </div> 

            <div id="search-results-area">
                </div>
            
            <div id="table-controls" style="display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 10px; margin-top: 20px;">
                <button id="edit-mode-btn">Edit</button>
                <button id="batch-delete-btn" style="display: none; background-color: #f44336; color: white; border: none; padding: 10px 15px; cursor: pointer;">Delete Selected</button>
            </div>

            <div id="results-area">
                <p>Loading database...</p>
            </div>
            
            <div class="bottom-controls">
                <div id="items-per-page-selector">
                    <label for="items-per-page">View:</label>
                    <select name="items-per-page" id="items-per-page">
                        <option value="25">25</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                        <option value="all">All</option>
                    </select>
                </div>
                <div class="pagination-container" id="pagination-controls"></div>
            </div>
        </article>
        <div class="ad-pillar"></div>
    </div> 

    <footer id="main-footer-placeholder"></footer>

    <div id="confirm-modal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; display: none; justify-content: center; align-items: center;">
      <div style="background: white; padding: 20px; border-radius: 10px; text-align: center; color: black; max-width: 80%;">
        <p id="confirm-message"></p>
        <button id="confirm-ok" style="background-color: #f44336; color: white; border: none; padding: 10px 20px; margin: 10px; border-radius: 5px; cursor: pointer;">Delete</button>
        <button id="confirm-cancel" style="background-color: #ccc; color: black; border: none; padding: 10px 20px; margin: 10px; border-radius: 5px; cursor: pointer;">Cancel</button>
      </div>
    </div>
    
    <style>
        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .pagination-btn {
            background-color: white;
            color: black;
            border: 1px solid #333;
            width: 35px;
            height: 35px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            font-weight: bold;
            font-family: monospace;
        }
        .pagination-btn:hover, .pagination-btn.active {
            background-color: #c8a2c8;
            border-color: #c8a2c8;
        }

        .search-box {
            margin-top: 20px;
        }

        #db-search {
            width: 100%;
            max-width: 400px;
            padding: 8px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        
        /* NEW STYLES */
        .bottom-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap-reverse; /* Puts pagination on right on small screens */
            margin-top: 20px;
            gap: 20px;
        }
        #items-per-page-selector {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #items-per-page {
            padding: 5px;
            border-radius: 5px;
            background-color: white;
            color: black;
            border: 1px solid #333;
            font-family: monospace;
            font-weight: bold;
        }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const resultsArea = document.getElementById('results-area');
            const searchResultsArea = document.getElementById('search-results-area');
            const fileInput = document.getElementById('file-input');
            const processBtn = document.getElementById('process-btn');
            const processingStatus = document.getElementById('processing-status');
            const paginationControls = document.getElementById('pagination-controls');
            const dbSearchInput = document.getElementById('db-search');
            const searchSubmitBtn = document.getElementById('search-submit');
            
            const editModeBtn = document.getElementById('edit-mode-btn');
            const batchDeleteBtn = document.getElementById('batch-delete-btn');
            const tableControls = document.getElementById('table-controls');
            let isInEditMode = false;
            
            // NEW: Items per page selector and state variable
            const itemsPerPageSelector = document.getElementById('items-per-page');
            let wordsPerPage = 25; // Default value
            
            let currentPage = 1;
            let currentWords = [];

            // --- Gematria Cipher Definitions ---
            const ciphers = {
                simple: { 'a': 1, 'b': 2, 'c': 3, 'd': 4, 'e': 5, 'f': 6, 'g': 7, 'h': 8, 'i': 9, 'j': 10, 'k': 11, 'l': 12, 'm': 13, 'n': 14, 'o': 15, 'p': 16, 'q': 17, 'r': 18, 's': 19, 't': 20, 'u': 21, 'v': 22, 'w': 23, 'x': 24, 'y': 25, 'z': 26 },
                english: { 'a': 6, 'b': 12, 'c': 18, 'd': 24, 'e': 30, 'f': 36, 'g': 42, 'h': 48, 'i': 54, 'j': 60, 'k': 66, 'l': 72, 'm': 78, 'n': 84, 'o': 90, 'p': 96, 'q': 102, 'r': 108, 's': 114, 't': 120, 'u': 126, 'v': 132, 'w': 138, 'x': 144, 'y': 150, 'z': 156 },
                jewish: { 'a': 1, 'b': 2, 'c': 3, 'd': 4, 'e': 5, 'f': 6, 'g': 7, 'h': 8, 'i': 9, 'j': 600, 'k': 10, 'l': 20, 'm': 30, 'n': 40, 'o': 50, 'p': 60, 'q': 70, 'r': 80, 's': 90, 't': 100, 'u': 200, 'v': 700, 'w': 900, 'x': 300, 'y': 400, 'z': 500 }
            };

            function calculateGematria(text) {
                const lowerText = text.toLowerCase().replace(/[^a-z]/g, '');
                let simple = 0, english = 0, jewish = 0;
                for (const char of lowerText) {
                    if (ciphers.simple[char]) {
                        simple += ciphers.simple[char];
                        english += ciphers.english[char];
                        jewish += ciphers.jewish[char];
                    }
                }
                return { simple, english, jewish };
            }

            function getAllEntries() {
                const data = localStorage.getItem('wordDatabase');
                return data ? JSON.parse(data) : [];
            }
            
            function filterEntries(searchTerm) {
                const allEntries = getAllEntries();
                if (!searchTerm) return allEntries;
                const lowerSearchTerm = searchTerm.toLowerCase();
                return allEntries.filter(entry => entry.word.toLowerCase().includes(lowerSearchTerm));
            }
            
            function toggleEditMode() {
                isInEditMode = !isInEditMode;
                editModeBtn.textContent = isInEditMode ? 'Cancel' : 'Edit';
                batchDeleteBtn.style.display = isInEditMode ? 'inline-block' : 'none';
                displayAllEntries(currentWords, currentPage);
            }

            function deleteWord(wordToDelete) {
                let words = getAllEntries();
                words = words.filter(entry => entry.word.toLowerCase() !== wordToDelete.toLowerCase());
                localStorage.setItem('wordDatabase', JSON.stringify(words));
                displayAllEntries(filterEntries(dbSearchInput.value), currentPage); 
            }
            
            function batchDeleteWords(wordsToDelete) {
                if (wordsToDelete.length === 0) {
                    showConfirmModal('Please select entries to delete.', null, true);
                    return;
                }
                let allEntries = getAllEntries();
                const wordsToDeleteSet = new Set(wordsToDelete.map(w => w.toLowerCase()));
                const remainingEntries = allEntries.filter(entry => !wordsToDeleteSet.has(entry.word.toLowerCase()));
                localStorage.setItem('wordDatabase', JSON.stringify(remainingEntries));
                isInEditMode = false;
                editModeBtn.textContent = 'Edit';
                batchDeleteBtn.style.display = 'none';
                const updatedFilteredEntries = filterEntries(dbSearchInput.value);
                displayAllEntries(updatedFilteredEntries, 1);
            }

            function displayAllEntries(entries, page = 1) {
                currentPage = page;
                if (!resultsArea) return;
                currentWords = entries;
                
                if (currentWords.length === 0) {
                    resultsArea.innerHTML = '<p style="text-align:center;">No words found. Upload a file to begin.</p>';
                    paginationControls.innerHTML = '';
                    tableControls.style.display = 'none';
                    document.querySelector('.bottom-controls').style.display = 'none';
                    return;
                }
                
                tableControls.style.display = 'flex';
                document.querySelector('.bottom-controls').style.display = 'flex';

                currentWords.sort((a, b) => a.word.localeCompare(b.word));

                const displayCount = wordsPerPage === 'all' ? currentWords.length : wordsPerPage;
                const startIndex = (currentPage - 1) * displayCount;
                const endIndex = startIndex + displayCount;
                const entriesForPage = currentWords.slice(startIndex, endIndex);

                const editHeader = isInEditMode ? '<th><input type="checkbox" id="select-all-checkbox" title="Select All on Page"></th>' : '';
                const deleteHeader = isInEditMode ? '' : '<th>Delete</th>';

                let tablesHtml = `
                    <table class="results-table">
                        <caption>All Words in Local Database (${currentWords.length} entries)</caption>
                        <thead>
                            <tr>
                                ${editHeader}
                                <th>Word/Phrase</th>
                                <th>Jewish</th>
                                <th>English</th>
                                <th>Simple</th>
                                ${deleteHeader}
                            </tr>
                        </thead>
                        <tbody>
                            ${entriesForPage.map(entry => {
                                const values = calculateGematria(entry.word);
                                const safeWordAttr = entry.word.replace(/"/g, "&quot;");
                                const editCell = isInEditMode ? `<td><input type="checkbox" class="entry-checkbox" data-word="${safeWordAttr}"></td>` : '';
                                const deleteCell = isInEditMode ? '' : `<td><button class="delete-btn" data-word="${safeWordAttr}">Delete</button></td>`;
                                return `
                                    <tr>
                                        ${editCell}
                                        <td><a href="calculator.html?word=${encodeURIComponent(entry.word)}">${entry.word}</a></td>
                                        <td>${values.jewish}</td>
                                        <td>${values.english}</td>
                                        <td>${values.simple}</td>
                                        ${deleteCell}
                                    </tr>
                                `;
                            }).join('')}
                        </tbody>
                    </table>`;
                
                resultsArea.innerHTML = tablesHtml;
                createPaginationControls(currentWords.length);

                if (isInEditMode) {
                    const selectAllCheckbox = document.getElementById('select-all-checkbox');
                    if (selectAllCheckbox) {
                        selectAllCheckbox.addEventListener('change', (event) => {
                            document.querySelectorAll('.entry-checkbox').forEach(checkbox => {
                                checkbox.checked = event.target.checked;
                            });
                        });
                    }
                } else {
                    document.querySelectorAll('.delete-btn').forEach(button => {
                        button.addEventListener('click', (event) => {
                            const wordToDelete = event.target.getAttribute('data-word');
                            showConfirmModal(`Are you sure you want to delete "${wordToDelete}"?`, () => {
                                deleteWord(wordToDelete);
                            });
                        });
                    });
                }
            }
            
            function createBreakdownHtml(word, cipherName, totalValue) {
                // ... (function content is unchanged)
            }
            function findLocalMatches(calculatedValues, originalWord) {
                // ... (function content is unchanged)
            }
            function displayCalculationAndMatches(word) {
                // ... (function content is unchanged)
            }

            function createPaginationControls(totalEntries) {
                paginationControls.innerHTML = '';
                if (wordsPerPage === 'all' || totalEntries <= wordsPerPage) {
                    return;
                }
                const totalPages = Math.ceil(totalEntries / wordsPerPage);
                for (let i = 1; i <= totalPages; i++) {
                    const pageBtn = document.createElement('button');
                    pageBtn.textContent = i;
                    pageBtn.classList.add('pagination-btn');
                    if (i === currentPage) {
                        pageBtn.classList.add('active');
                    }
                    pageBtn.addEventListener('click', () => {
                        displayAllEntries(currentWords, i);
                    });
                    paginationControls.appendChild(pageBtn);
                }
            }
            
            function showConfirmModal(message, onConfirm, isAlert = false) {
                const confirmModal = document.getElementById('confirm-modal');
                const confirmMessage = document.getElementById('confirm-message');
                const confirmOk = document.getElementById('confirm-ok');
                const confirmCancel = document.getElementById('confirm-cancel');
                
                confirmMessage.textContent = message;
                
                if (onConfirm) {
                    confirmOk.style.display = 'inline-block';
                    confirmOk.onclick = () => {
                        onConfirm();
                        hideConfirmModal();
                    };
                } else {
                    confirmOk.style.display = 'none';
                }

                confirmCancel.onclick = () => {
                    hideConfirmModal();
                };

                confirmModal.style.display = 'flex';
            }
            
            function hideConfirmModal() {
                const confirmModal = document.getElementById('confirm-modal');
                confirmModal.style.display = 'none';
            }
            
            function recordWord(word) {
                // This function is still the same, but it should be noted
                // that it will save to localStorage as per the original file's logic.
            }
            async function processFiles() {
                // This function is still the same, but it should be noted
                // that it will save to localStorage as per the original file's logic.
            }
            

            // --- Event Listeners ---
            
            itemsPerPageSelector.addEventListener('change', (event) => {
                const selectedValue = event.target.value;
                wordsPerPage = (selectedValue === 'all') ? 'all' : parseInt(selectedValue, 10);
                displayAllEntries(currentWords, 1);
            });

            editModeBtn.addEventListener('click', toggleEditMode);
            
            batchDeleteBtn.addEventListener('click', () => {
                const checkedBoxes = document.querySelectorAll('.entry-checkbox:checked');
                const wordsToDelete = Array.from(checkedBoxes).map(box => box.getAttribute('data-word'));
                if (wordsToDelete.length > 0) {
                    showConfirmModal(`Are you sure you want to delete ${wordsToDelete.length} selected entries?`, () => {
                        batchDeleteWords(wordsToDelete);
                    });
                } else {
                    showConfirmModal('Please select entries to delete.', null, true);
                }
            });

            processBtn.addEventListener('click', processFiles);

            searchSubmitBtn.addEventListener('click', () => {
                const searchTerm = dbSearchInput.value.trim();
                if (searchTerm) {
                    recordWord(searchTerm);
                    displayCalculationAndMatches(searchTerm);
                    displayAllEntries(filterEntries(dbSearchInput.value));
                }
            });
            
            dbSearchInput.addEventListener('keydown', (event) => {
                if (event.key === 'Enter') {
                    event.preventDefault();
                    searchSubmitBtn.click();
                }
            });

            dbSearchInput.addEventListener('input', () => {
                const filteredEntries = filterEntries(dbSearchInput.value);
                displayAllEntries(filteredEntries, 1);
            });
            
            // --- Initial Load ---
            displayAllEntries(getAllEntries());
        });
    </script>
</body>
</html>
