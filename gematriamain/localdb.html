<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text File Processor</title>
    <link rel="stylesheet" href="gematria.css">
    <link rel="stylesheet" href="../header.css">
    <link rel="stylesheet" href="../footer.css">
    <script src="../header.js" defer></script> 
    <script src="../footer.js" defer></script> 
</head>
<body>
    <div id="main-header-placeholder"></div>
    <div class="container">
        <div class="ad-pillar"></div>
        <div class="content">
            <div class="search-area" id="upload">
                <h1 class="main-title">Text File Processor</h1>
                <p class="subtitle">Upload and Analyze Text Files</p>
                <p class="info-text">Upload .txt, .md, or .db files to process sentences and save them to your local database.</p>
                <div id="upload-section">
                    <input type="file" id="file-input" accept=".txt,.md,.db" multiple>
                    <button id="process-btn">Process Files</button>
                </div>
            </div>
            <div id="results-section">
                <table class="results-table">
                    <caption>Top 10 Most Frequent Sentences</caption>
                    <thead>
                        <tr>
                            <th>Sentence</th>
                            <th>Count</th>
                        </tr>
                    </thead>
                    <tbody id="results"></tbody>
                </table>
            </div>
        </div>
        <div class="ad-pillar"></div>
    </div>
    <footer id="main-footer-placeholder"></footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const DB_KEY = 'gematriaSentencesDB';

            // --- LOCALSTORAGE DATABASE FUNCTIONS ---
            function recordSearch(term) {
                const cleanedTerm = term.trim().toLowerCase();
                if (!cleanedTerm) return;

                try {
                    const dbString = localStorage.getItem(DB_KEY) || '{}';
                    const db = JSON.parse(dbString);
                    
                    db[cleanedTerm] = (db[cleanedTerm] || 0) + 1;
                    
                    localStorage.setItem(DB_KEY, JSON.stringify(db));
                } catch (error) {
                    console.error("Failed to record search in localStorage:", error);
                }
            }

            function getTopSearches(limit = 10) {
                try {
                    const dbString = localStorage.getItem(DB_KEY) || '{}';
                    const db = JSON.parse(dbString);

                    const allRecords = Object.entries(db).map(([term, count]) => ({ term, count }));

                    allRecords.sort((a, b) => b.count - a.count);

                    return allRecords.slice(0, limit);
                } catch (error) {
                    console.error("Failed to get top searches from localStorage:", error);
                    return [];
                }
            }

            // --- PAGE LOGIC ---
            const fileInput = document.getElementById('file-input');
            const processBtn = document.getElementById('process-btn');
            const resultsBody = document.getElementById('results');

            async function processFiles() {
                resultsBody.innerHTML = '<tr><td colspan="2">Processing...</td></tr>';
                const files = fileInput.files;
                if (files.length === 0) {
                    resultsBody.innerHTML = '<tr><td colspan="2">No files selected. Please choose one or more files.</td></tr>';
                    return;
                }

                const processedSentences = new Set();
                for (const file of files) {
                    try {
                        const text = await file.text();
                        let sentences = text.split(/[.!?\n]+/).map(s => s.trim()).filter(s => s);
                        sentences = sentences.map(sentence => {
                            return sentence.replace(/[0-9]/g, '')
                                          .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()"]/g, '')
                                          .trim()
                                          .toLowerCase();
                        }).filter(s => s);
                        sentences.forEach(sentence => processedSentences.add(sentence));
                    } catch (error) {
                        console.error(`Could not read file ${file.name}:`, error);
                    }
                }

                for (const sentence of processedSentences) {
                    recordSearch(sentence); // Using the new localStorage function
                }
                
                alert(`Processing complete! ${processedSentences.size} unique sentences were saved or updated.`);
                loadTopSearches();
            }

            function loadTopSearches() {
                const topSearches = getTopSearches(10); // Using the new localStorage function
                if (topSearches.length === 0) {
                    resultsBody.innerHTML = '<tr><td colspan="2">No sentences stored yet. Upload a file to begin.</td></tr>';
                } else {
                    resultsBody.innerHTML = topSearches.map(s => `
                        <tr>
                            <td>${s.term}</td>
                            <td>${s.count}</td>
                        </tr>
                    `).join('');
                }
            }

            processBtn.addEventListener('click', processFiles);
            loadTopSearches();
        });
    </script>
</body>
</html>
