<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gematria Statistics</title>
    <link rel="stylesheet" href="/gematriamain/gematria.css">
    <link rel="stylesheet" href="../header.css">
    <link rel="stylesheet" href="../footer.css">
    <script src="../header.js" defer></script> 
    <script src="../footer.js" defer></script> 
    <!-- Changed to type="module" to support Firebase imports -->
    <script src="statistics.js" type="module"></script>
</head>
<body>
    <div id="main-header-placeholder"></div>
    <div class="container">
        <div class="ad-pillar"></div>
        <article class="content">
            <!-- Site Icon -->
            <img src="../icon.png" alt="Statistics Icon" style="width: 100px; height: 100px; display: block; margin: 2rem auto 1rem auto; border-radius: 50%;">
            
            <div class="search-area">
                <h1 class="main-title">Database Statistics</h1>
                <p class="subtitle">An overview of search activity and database entries.</p>
                <div style="text-align: center; margin-top: 1rem; padding: 0.5rem; background-color: lab(100% 0.01 -0.01 / 0); border-radius: 8px;">
                    <label for="use-localstorage" style="cursor: pointer; font-size: 0.9rem; color: #000000;">
                        <input type="checkbox" id="use-localstorage" name="use-localstorage" style="vertical-align: middle;">
                        Use Local Storage Instead of Firebase
                    </label>
                </div>
            </div>

            <!-- Most Searched Words -->
            <div id="most-searched-section" class="results-section">
                <h2 class="results-header">Top 20 Most Searched Terms</h2>
                <table class="results-table">
                    <thead>
                        <tr>
                            <th>Term</th>
                            <th>Search Count</th>
                        </tr>
                    </thead>
                    <tbody id="most-searched-body"></tbody>
                </table>
            </div>

            <!-- Most Recently Searched Words -->
            <div id="recent-searches-section" class="results-section" style="margin-top: 3rem;">
                <h2 class="results-header">Top 20 Most Recently Searched Terms</h2>
                <table class="results-table">
                    <thead>
                        <tr>
                            <th>Term</th>
                        </tr>
                    </thead>
                    <tbody id="recent-searches-body"></tbody>
                </table>
            </div>

            <!-- Most Recently Added Words -->
            <div id="recent-additions-section" class="results-section" style="margin-top: 3rem;">
                <h2 class="results-header">Top 20 Most Recently Added Words</h2>
                <table class="results-table">
                    <thead>
                        <tr>
                            <th>Word</th>
                            <th>Jewish</th>
                            <th>English</th>
                            <th>Simple</th>
                        </tr>
                    </thead>
                    <tbody id="recent-additions-body"></tbody>
                </table>
            </div>

        </article>
        <div class="ad-pillar"></div>
    </div>
    <footer id="main-footer-placeholder"></footer>
</body>
</html>
