<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gematria Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Roboto+Mono&display=swap" rel="stylesheet">
    <!-- This line links to your stylesheet -->
    <link rel="stylesheet" href="gematria.css">
</head>
<body data-theme="dark">

    <nav class="main-nav">
        <div class="nav-links">
            <a href="#" class="active">Calculator</a>
        </div>
        <button id="theme-toggle" class="theme-toggle-button">🌓</button>
    </nav>

    <div class="container">
        <header class="site-header">
             <div class="input-area">
                <input type="text" id="gematria-input" placeholder="Type a word, phrase, or number...">
                <button id="save-button" disabled>Save</button>
            </div>
        </header>

        <main class="main-content">
            <div id="results-summary" class="results-summary-bar"></div>
            <div id="breakdown-container" class="breakdown-container"></div>
            <div id="comparison-container" class="comparison-container"></div>

            <details class="cipher-settings-collapsible" open>
                <summary>Ciphers</summary>
                <div id="cipher-settings"></div>
            </details>

            <div id="db-matches-container"></div>
            
            <section class="corpus-uploader">
                <h3>Corpus Uploader</h3>
                <p>Upload a .txt file to add its lines to the database.</p>
                <input type="file" id="file-input" accept=".txt" style="display: none;">
                <label for="file-input" id="upload-button" style="cursor:pointer; background-color: var(--primary-color); color: white; padding: 10px 15px; border-radius: 8px;">Choose File</label>
                <span id="upload-status"></span>
            </section>
        </main>
    </div>

    <!-- Modal for Resonance Report -->
    <div id="resonance-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <button class="modal-close-button">&times;</button>
            <h2 id="modal-title">Resonance Report</h2>
            <div id="modal-body"></div>
        </div>
    </div>
    
    <!-- This line runs your script -->
    <script type="module" src="gematria.js"></script>
</body>
</html>
