<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gematria Calculator</title>
    <meta name="description" content="Gematria Calculator with database matching, breakdown analysis, and multiple cipher support.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Roboto+Mono&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="gematria.css">
</head>
<body>

    <header>
        <a href="#" onclick="return viewMenu();" class="menu-button-link">
            <img src="https://placehold.co/32x32/ffffff/000000?text=%E2%98%B0" alt="menu button" class="menu-button" />
        </a>
        <div class="menu" id="menu">
            <div class="menu-column">
                <ul>
                    <li><a href="gematria.html" class="active">Calculator</a></li>
                    <li><a href="numerology.html">Numerology</a></li>
                    <li><a href="tools.html">Tools</a></li>
                </ul>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="ad-pillar">
            <!-- Ad content would go here -->
        </div>

        <section class="content">
            <div class="search">
                <img src="https://placehold.co/80x80/c2a2c2/ffffff?text=G" alt="Gematria Icon" />
                <h1>Gematria Calculator</h1>
                <h2>With Database Matching & Analysis</h2>
                <div class="input-area">
                    <input type="search" id="gematria-input" placeholder="Type a word, phrase, or number..." maxlength="200" />
                    <button id="save-button" disabled>Save</button>
                </div>
            </div>

            <div id="results">
                <!-- All your dynamic components will be injected here by the JS -->
                <div id="results-summary"></div>
                <div id="breakdown-container"></div>
                <div id="comparison-container"></div>
                
                <details class="cipher-settings-collapsible" open>
                    <summary>Cipher Settings</summary>
                    <div id="cipher-settings"></div>
                </details>

                <div id="db-matches-container"></div>

                 <section class="corpus-uploader">
                    <h3>Corpus Uploader</h3>
                    <p>Upload a .txt file to add its lines to the database.</p>
                    <input type="file" id="file-input" accept=".txt" style="display: none;">
                    <label for="file-input" class="upload-button-label">Choose File</label>
                    <span id="upload-status"></span>
                </section>
            </div>
        </section>

        <div class="ad-pillar">
            <!-- Ad content would go here -->
        </div>
    </div>

    <footer>
        <div class="footer-line">
            <ul>
                <li><a href="gematria.html">Calculator</a></li>
                <li><a href="numerology.html">Numerology</a></li>
                <li><a href="tools.html">Tools</a></li>
            </ul>
        </div>
        <div>
            &copy; 2025 Gematria Calculator Project
        </div>
    </footer>

    <!-- Modal for Resonance Report -->
    <div id="resonance-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <button class="modal-close-button">&times;</button>
            <h2 id="modal-title">Resonance Report</h2>
            <div id="modal-body"></div>
        </div>
    </div>
    
    <script type="module" src="gematria.js"></script>
    <script src="firebase-config.js"></script>
    <script>
        // Global function for menu toggle
        function viewMenu() {
            document.getElementById('menu').classList.toggle('active');
            return false;
        }
    </script>
</body>
</html>
