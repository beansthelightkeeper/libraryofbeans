<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gematria Calculator Statistics</title>
    <link rel="icon" type="image/png" href="../icon.png">
    
    <!-- This font is not in the target, but provides a cleaner look than default Arial -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arimo&display=swap" rel="stylesheet">
    
    <!-- Link to shared header CSS -->
    <link rel="stylesheet" href="../header.css">
    <!-- Link to the specific CSS for this page -->
    <link rel="stylesheet" href="gematria.css">
</head>
<body data-theme="light"> <!-- Defaulting to light theme to match the screenshot -->

    <!-- The dynamic header will be inserted here -->
    <div id="main-header-placeholder"></div>

    <div class="container">
        <div class="ad-pillar"></div> <!-- Left pillar -->

        <section class="content">
            <div class="search-area">
                <img src="https://placehold.co/100x100/CCCCCC/808080?text=Seal" alt="Rambam Seal" />
                <h1>Gematria Calculator Statistics</h1>
                <h2>Statistics for Gimatria phrases</h2>
                
                <form id="gematria-form">
                    <div class="info-text">
                        (Type in a word or a number e.g. 
                        <a href="#" class="example-link">God</a>, 
                        <a href="#" class="example-link">Devil</a>, 
                        <a href="#" class="example-link">100</a>, 
                        <a href="#" class="example-link">666</a> 
                        - To calculate gematria values)
                    </div>
                    <input type="search" id="text-input" placeholder="Insert phrase" maxlength="200" autofocus />
                    <br>
                    <input type="submit" value="Calculate Gematria" />
                    <br><br>
                    <label>
                        <input type="checkbox" id="view-rude-words" /> View Rude Words
                    </label>
                </form>
            </div>

            <div id="results-area">
                 <div id="current-search-results">
                    <!-- Results for the latest search will appear here -->
                </div>
                <table class="results-table">
                    <caption>Most searched Gematria words</caption>
                    <thead>
                        <tr>
                            <th>Word</th>
                            <th>Jewish</th>
                            <th>English</th>
                            <th>Simple</th>
                            <th>Searches</th>
                        </tr>
                    </thead>
                    <tbody id="stats-tbody">
                        <!-- Statistics rows will be injected here from local-db -->
                    </tbody>
                </table>
            </div>
        </section>

        <div class="ad-pillar"></div> <!-- Right pillar -->
    </div> 

    <footer>
        &copy; 2025 Library of Beans
    </footer>

    <!-- Set the path prefix for this subdirectory -->
    <script>
        window.pathPrefix = '..';
    </script>
    <script src="../header.js"></script>
    <script src="../firebase-config.js"></script>
    <script type="module" src="local-db.js"></script>
    <script type="module" src="gematria.js"></script>
</body>
</html>
